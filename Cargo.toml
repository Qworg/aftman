[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.88, not 1.85, because it is the floor set by the security fixes rather than a preference:
# every `time` release that patches RUSTSEC-2026-0009 (>= 0.3.47) requires 1.88, so staying at
# 1.85 would mean shipping the advisory. See the ratatui note below for the other half.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/qworg/aftman"
description = "An agent supervisor: a fast decision model above slower coding agents"

[workspace.dependencies]
aftman-core = { path = "crates/aftman-core" }
aftman-store = { path = "crates/aftman-store" }
aftman-workers = { path = "crates/aftman-workers" }
aftman-daemon = { path = "crates/aftman-daemon" }
aftman-jev = { path = "crates/aftman-jev" }
aftman-web = { path = "crates/aftman-web" }

anyhow = "1.0"
async-trait = "0.1"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive", "env"] }
nix = { version = "0.29", features = ["signal", "process", "fs", "user"] }
# In-process repository reading. Observing a repository must never execute a program the
# repository names, and git's clean/smudge/process filters, fsmonitor, diff drivers and
# textconv are all programs with no switch to disable them. gix gives status and diffs as
# data, so the filter pipeline is one this code constructs (with an empty driver list)
# rather than one the repository configures. Feature set is deliberately minimal: `status`
# pulls in dirwalk/index/gix-diff and, through `blob-diff`, `attributes`/gix-filter, which is
# the pipeline type we build empty ourselves; `revision` gives HEAD; `sha1` the object hash;
# and `interrupt` the build that the status walk's interrupt polling is compiled against.
gix = { version = "0.89", default-features = false, features = [
  "status",
  "revision",
  "sha1",
  "interrupt",
] }
# TUI: the crossterm backend is reached through `ratatui::crossterm`, so there is one
# crossterm in the tree. 0.30 is the first release that drops `lru` (unsound: RUSTSEC-2026-0253,
# RUSTSEC-2026-0002) and `paste` (unmaintained: RUSTSEC-2024-0436) from its dependencies.
# `paste` has no patched release, so removing it is the only way to clear that advisory rather
# than permanently ignoring it. 0.30 needs rustc 1.88, which `rust-version` now requires anyway;
# see the note there.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }
serde = { version = "1.0", features = ["derive"] }
# URL parsing for the base-URL guard. Already in the tree via reqwest.
url = "2.5"
serde_json = "1.0"
tempfile = "3.12"
thiserror = "2.0"
toml = "0.8"
time = { version = "0.3", features = ["serde", "formatting", "macros", "parsing"] }
tokio = { version = "1.40", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "fs",
  "io-util",
  "process",
  "signal",
  "net",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
uuid = { version = "1.10", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# `pedantic` is NOT enabled wholesale. It is a large group whose value here is
# mostly stylistic (`needless_pass_by_value`, `items_after_statements`, …), and
# turning it on from M0 would mean either a wall of `allow`s or a wall of churn in
# a codebase that does not exist yet. Individual pedantic lints get enabled when
# there is a concrete reason; the ones below are judgements worth recording.
#
# Deliberately allowed, with reasons:
must_use_candidate = "allow"     # noisy on pure accessors with no caller yet
doc_markdown = "allow"           # `aftman`/`Jev`/`f32` in prose is not code
module_name_repetitions = "allow" # `policy::PolicyInput` reads better than the alternative
cast_precision_loss = "allow"    # f32<->f64 on probabilities is intentional and bounded
cast_possible_truncation = "allow" # byte counts fit usize by construction

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
