# quality.documentation — conditional, and the reason routing exists.
#
# This responsibility does not participate unless the router decides the incoming job
# asks for documentation. Routing sees the job text, never the repository.
enabled = true
always = false
title = "Documentation"
routing_instructions = """
Does the incoming work explicitly require creating or updating README content, user guides,
API documentation, release notes, or other documentation delivered with the repository?
"""
routing_threshold = 0.70

[checks.documentation_sufficient]
instructions = """
When documentation is required by the original job, is the relevant documentation complete,
accurate, and consistent with the implemented behavior?
"""
min_threshold = 0.75

# This responsibility has no runtime-aware logic, so its rule is expressed here. That is
# the declarative path's purpose: a rule over check results, with no facts a condition
# cannot see.
[[rules]]
id = "quality.documentation:insufficient"
when = "quality.documentation__documentation_sufficient < 0.75"
propose = "start-worker"
reason = "the job requires documentation that is not yet complete"
stakes = "high"
